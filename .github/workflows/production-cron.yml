name: Production daily job

on:
  schedule:
    # 10:00 Asia/Kolkata
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-daily-job
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run idempotent daily maintenance and reminders
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PRODUCTION_URL:?Add the PRODUCTION_URL repository secret}"
          : "${CRON_SECRET:?Add the CRON_SECRET repository secret}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 300 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_URL%/}/api/cron/daily"
